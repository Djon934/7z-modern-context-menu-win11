name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - name: Check tag matches VERSION
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION).Trim()
          if ($env:TAG -ne "v$ver") { throw "Тег $env:TAG не совпадает с VERSION ($ver)" }
          "VERSION=$ver" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Release notes from CHANGELOG
        shell: pwsh
        run: ./scripts/extract-notes.ps1 -Version $env:VERSION
      - name: Build
        shell: powershell
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: ./scripts/build.ps1 -Version $env:VERSION
      - name: SHA256 checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Where-Object Name -ne 'SHA256SUMS.txt' |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Set-Content dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        shell: pwsh
        run: |
          $files = (Get-ChildItem dist -File).FullName
          $pre = $env:VERSION.Contains('-')
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            # Релиз уже создан через веб-интерфейс: добавляем файлы и описание
            gh release upload $env:TAG @files --clobber
            gh release edit $env:TAG --notes-file release-notes.md --prerelease=$($pre.ToString().ToLower())
          } else {
            $a = @($env:TAG, '--title', $env:TAG, '--notes-file', 'release-notes.md')
            if ($pre) { $a += '--prerelease' }
            gh release create @a @files
          }
