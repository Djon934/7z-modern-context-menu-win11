name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v6

      - name: Check VERSION format (SemVer)
        shell: pwsh
        run: |
          $v = (Get-Content VERSION).Trim()
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Invalid VERSION format: $v" }
          "VERSION=$v" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build
        shell: powershell
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
          ARCH: ${{ matrix.arch }}
        run: ./scripts/build.ps1 -Version $env:VERSION -Arch $env:ARCH

      - name: SHA256 checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Where-Object Name -ne 'SHA256SUMS.txt' |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Set-Content dist/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ModernMenu7z-${{ env.VERSION }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  installer:
    name: Setup.exe (x64 + arm64)
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read VERSION
        shell: pwsh
        run: |
          $v = (Get-Content VERSION).Trim()
          "VERSION=$v" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Download x64 build
        uses: actions/download-artifact@v8
        with:
          name: ModernMenu7z-${{ env.VERSION }}-x64
          path: payload/x64

      - name: Download arm64 build
        uses: actions/download-artifact@v8
        with:
          name: ModernMenu7z-${{ env.VERSION }}-arm64
          path: payload/arm64

      - name: Build Setup.exe
        shell: powershell
        run: ./scripts/build-installer.ps1 -Version $env:VERSION -PayloadDir "$PWD\payload" -OutDir "$PWD\setup-out"

      - name: Upload Setup.exe
        uses: actions/upload-artifact@v7
        with:
          name: ModernMenu7z-Setup-${{ env.VERSION }}
          path: setup-out/*.exe
          if-no-files-found: error
          retention-days: 14
