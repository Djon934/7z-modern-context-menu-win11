name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check VERSION format (SemVer)
        shell: pwsh
        run: |
          $v = (Get-Content VERSION).Trim()
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Неверный формат VERSION: $v" }
          "VERSION=$v" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build
        shell: powershell
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: ./scripts/build.ps1 -Version $env:VERSION

      - name: SHA256 checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Where-Object Name -ne 'SHA256SUMS.txt' |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Set-Content dist/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: 7zip-modern-menu-${{ env.VERSION }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
