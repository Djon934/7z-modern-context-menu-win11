name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6

      - name: Check tag matches VERSION
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION).Trim()
          if ($env:TAG -ne "v$ver") { throw "Tag $env:TAG does not match VERSION ($ver)" }
          "VERSION=$ver" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Release notes from CHANGELOG
        shell: pwsh
        run: ./scripts/extract-notes.ps1 -Version $env:VERSION

      - name: Build
        shell: powershell
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: ./scripts/build.ps1 -Version $env:VERSION

      - name: Package release zip and checksums
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
        run: |
          if (-not $env:VERSION.Contains('-') -and -not $env:SIGN_PFX_BASE64) {
            throw 'Stable release requires the permanent signing certificate (secret SIGN_PFX_BASE64).'
          }
          New-Item -ItemType Directory release | Out-Null
          $zip = "release/ModernMenu7z-$env:VERSION-x64.zip"
          Compress-Archive -Path dist/* -DestinationPath $zip
          $h = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$h  $(Split-Path $zip -Leaf)" | Set-Content release/SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: pwsh
        run: |
          $files = (Get-ChildItem release -File).FullName
          $pre = $env:VERSION.Contains('-')
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG @files --clobber
            gh release edit $env:TAG --notes-file release-notes.md --prerelease=$($pre.ToString().ToLower())
          } else {
            $a = @($env:TAG, '--title', $env:TAG, '--notes-file', 'release-notes.md')
            if ($pre) { $a += '--prerelease' }
            gh release create @a @files
          }
